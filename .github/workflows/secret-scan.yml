name: secret-scan

# Scans the files and the Git history for secrets with gitleaks. The image is
# pinned by tag and digest. On a pull request: the whole tree, then every commit
# of the pull request. On a push to main, the weekly run and a manual run: the
# whole tree and the whole history. The repository's .gitleaks.toml is used when
# there is one, else gitleaks' default rules.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Whole tree
        run: |
          config=()
          if [ -f .gitleaks.toml ]; then config=(--config /config/gitleaks.toml); fi
          mounts=()
          if [ -f .gitleaks.toml ]; then mounts=(-v "$PWD/.gitleaks.toml:/config/gitleaks.toml:ro"); fi
          git ls-files -z -co --exclude-standard --deduplicate |
            tar --null --no-recursion --ignore-failed-read -T - -cf - 2>/dev/null |
            docker run --rm -i -u "$(id -u):$(id -g)" -e HOME=/tmp \
              "${mounts[@]}" --entrypoint sh "$GITLEAKS_IMAGE" -c '
                d=$(mktemp -d) && tar -x -C "$d" && exec gitleaks dir "$d" "$@"' sh \
              "${config[@]}" --redact --verbose --no-banner

      - name: Commits of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          config=()
          if [ -f .gitleaks.toml ]; then config=(--config /repo/.gitleaks.toml); fi
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo:ro" -w /repo \
            "$GITLEAKS_IMAGE" git /repo --log-opts="$BASE_SHA..$HEAD_SHA" \
            "${config[@]}" --redact --verbose --no-banner

      - name: Whole history
        if: github.event_name != 'pull_request'
        run: |
          config=()
          if [ -f .gitleaks.toml ]; then config=(--config /repo/.gitleaks.toml); fi
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo:ro" -w /repo \
            "$GITLEAKS_IMAGE" git /repo "${config[@]}" --redact --verbose --no-banner
